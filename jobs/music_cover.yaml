description: Re-renders a music track in the style of a caption with ACE-Step 1.5, keeping its length and structure.
modality: music
params:
  audio: The source track.
  caption: Description of the target style.
  lyrics: Lyrics of the new version. Section tags such as [Verse] or [Chorus] stand on their own line. Empty lyrics give music without vocals.
  cover_strength: Share of the diffusion steps that are conditioned on the track; the other steps follow the caption and the lyrics. At 1.0 every step sees the track, at 0.0 none does.
  vocal_language: Language code of the lyrics; unknown passes no language.
  steps: Number of diffusion steps.
  shift: Timestep shift of the diffusion schedule; higher values spend more of the steps at high noise levels, 1.0 leaves the schedule linear.
  seed: Seed of the random draws; "random" picks a seed. Item i of a job with count above 1 uses the seed plus i.
outputs:
  music.wav: The new version, stereo 16-bit PCM WAV.
