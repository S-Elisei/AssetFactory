description: Generates one image from a text prompt with Z-Image-Turbo.
params:
  prompt: Description of the image in natural language, English or Chinese.
  width: Output width in pixels.
  height: Output height in pixels.
  steps: Number of sampling steps.
  seed: Seed of the random draws; "random" picks a seed. Item i of a job with count above 1 uses the seed plus i.
outputs:
  image.png: The generated image, RGB.
